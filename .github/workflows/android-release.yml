name: Android release

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$gradle_version"
          echo "Building tag $version with gradle version $gradle_version"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            go.sum
            go_client/go.sum

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Prepare signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore_path="keystore/moschata-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            printf '%s\n' \
              "KEYSTORE_FILE=$(pwd)/$keystore_path" \
              "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" \
              "KEY_ALIAS=$KEY_ALIAS" \
              "KEY_PASSWORD=$KEY_PASSWORD" > local.properties
          elif [ -f "$keystore_path" ]; then
            echo "Using committed permanent release keystore from repository."
            printf '%s\n' \
              "KEYSTORE_FILE=$(pwd)/$keystore_path" \
              "KEYSTORE_PASSWORD=moschata123" \
              "KEY_ALIAS=moschata" \
              "KEY_PASSWORD=moschata123" > local.properties
          else
            echo "Error: Keystore not found at $keystore_path" >&2
            exit 1
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:testReleaseUnitTest --no-daemon 2>&1 | tee test_output.log

      - name: Build release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease -PtargetAbis=arm64-v8a,armeabi-v7a,x86_64 --no-daemon 2>&1 | tee build_output.log

      - name: Capture build log on failure
        if: failure()
        shell: bash
        run: |
          cp test_output.log /tmp/test_output.log 2>/dev/null || true
          cp build_output.log /tmp/build_output.log 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug-log
          git rm -rf . || true
          echo "=== TEST OUTPUT ===" > ci_error.log
          cat /tmp/test_output.log >> ci_error.log 2>/dev/null || true
          echo "=== BUILD OUTPUT ===" >> ci_error.log
          cat /tmp/build_output.log >> ci_error.log 2>/dev/null || true
          git add ci_error.log
          git commit -m "Capture build failure log" || true
          git push -f origin ci-debug-log || true

      - name: Verify and name APKs
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
            version="${gradle_version}-git-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          found=0
          for apk in app/build/outputs/apk/release/*.apk; do
            test -f "$apk" || continue
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
            base="$(basename "$apk")"
            arch="${base#app-}"
            arch="${arch%-release.apk}"
            cp "$apk" "dist/moschata-vpn-${version}-${arch}.apk"
            found=1
          done
          test "$found" = 1
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: moschata-vpn-${{ env.APP_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--title "Moschata VPN ${GITHUB_REF_NAME}" --generate-notes)
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
